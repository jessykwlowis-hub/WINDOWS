name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          ls -la
          find . -iname "*.zip" -not -path "./.git/*"
          Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
          echo "Usando: $Z"
          unzip -o -q "$Z" -d projeto
          find projeto -name settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: |
          D=$(dirname $(find projeto -name settings.gradle.kts | head -n 1))
          cd "$D"
          gradle assembleRelease --no-daemon
          mkdir -p $GITHUB_WORKSPACE/saida
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/saida/
      - uses: actions/upload-artifact@v4
        with:
          name: LumenLastLight-APK
          path: saida/*.apk
